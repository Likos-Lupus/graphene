name: CI

on:
  push:
  pull_request:

permissions: read-all

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo doc --workspace --no-deps
      - run: python scripts/check_architecture.py
      - run: python scripts/check_hygiene.py

  hosts:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build reference frontend
        working-directory: apps/graphene-tauri
        run: |
          npm ci
          npm run build
      - name: Host Rust gates
        working-directory: apps
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --all-targets
          cargo test --workspace
          cargo clippy --workspace --all-targets -- -D warnings
          cargo doc --workspace --no-deps
      - name: Frontend typecheck
        working-directory: apps/graphene-tauri
        run: npm run typecheck

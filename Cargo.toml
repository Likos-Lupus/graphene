[package]
name = "graphene"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[workspace]
members = [
    ".",
    "crates/graphene-core",
    "crates/graphene-platform",
    "crates/graphene-network",
    "crates/graphene-storage",
    "crates/graphene-service",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LGPL-3"
rust-version = "1.97.1"

[workspace.dependencies]
graphene-core = { path = "crates/graphene-core", version = "0.1.0" }
graphene-platform = { path = "crates/graphene-platform", version = "0.1.0" }
graphene-network = { path = "crates/graphene-network", version = "0.1.0" }
graphene-storage = { path = "crates/graphene-storage", version = "0.1.0" }
graphene-service = { path = "crates/graphene-service", version = "0.1.0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "system-proxy"] }
futures-util = "0.3"
sha1 = "0.11.0"
sha2 = "0.11.0"
tracing = "0.1"
fs2 = "0.4"
tempfile = "3"

[dependencies]
graphene-core.workspace = true
graphene-service.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
